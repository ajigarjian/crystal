version: '3'

services:
  firebase-emulator:
    build:
      context: .
      dockerfile: Dockerfile.emulator.simple
    container_name: firebase-emulator-simple
    ports:
      - "4000:4000"  # Emulator UI
      - "4400:4400"  # Emulator Hub
      - "5001:5001"  # Functions
      - "8080:8080"  # Firestore
    volumes:
      - ./functions:/app/functions
      - ./firebase.json:/app/firebase.json
    environment:
      - FIREBASE_DEBUG=true
    mem_limit: 4g
    restart: "no"
    tty: true
    stdin_open: true